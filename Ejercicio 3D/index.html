<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 3D - Reproductor A-Frame</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #08111f;
    }

    #hud {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      width: min(92vw, 720px);
      padding: 12px 16px;
      border-radius: 14px;
      background: rgba(8, 17, 31, 0.82);
      color: #f2f7ff;
      text-align: center;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(8px);
    }

    #hud strong {
      display: block;
      margin-bottom: 4px;
      font-size: 1rem;
    }

    #hud span {
      font-size: 0.92rem;
      color: #c6d4ea;
    }
  </style>
</head>

<body>
  <div id="hud">
    <strong id="song-title">Canción actual: lista preparada</strong>
    <span id="status-text">Mira un control durante 1 segundo para activar su acción.</span>
  </div>

  <audio id="audio-player" preload="auto"></audio>

  <a-scene background="color: #0b1728">
    <a-assets>
      <img id="sky-texture" src="https://cdn.aframe.io/360-image-gallery-boilerplate/img/sechelt.jpg" alt="Entorno 360">
    </a-assets>

    <a-sky src="#sky-texture" rotation="0 -90 0"></a-sky>

    <a-entity position="0 1.6 0">
      <a-camera wasd-controls-enabled="false">
        <a-cursor color="#ffffff" fuse="true" fuse-timeout="1000"
          geometry="primitive: ring; radiusInner: 0.012; radiusOuter: 0.02"
          material="shader: flat; color: #ffffff; opacity: 0.95"
          animation__mouseenter="property: material.color; to: #7dd3fc; startEvents: mouseenter; dur: 150"
          animation__mouseleave="property: material.color; to: #ffffff; startEvents: mouseleave; dur: 150"
          animation__fusing="property: scale; to: 0.25 0.25 0.25; startEvents: fusing; dur: 1000; easing: linear"
          animation__resetscale="property: scale; to: 1 1 1; startEvents: mouseleave; dur: 150"
          animation__click="property: scale; to: 1.25 1.25 1.25; startEvents: click; dur: 120; dir: alternate"
          raycaster="objects: .interactable"></a-cursor>
      </a-camera>
    </a-entity>

    <a-plane position="0 0 -6" rotation="-90 0 0" width="18" height="18" color="#1e3a5f" shadow></a-plane>

    <a-box position="0 1.2 -5" depth="0.4" height="2.5" width="7.5" color="#10263f" opacity="0.75"></a-box>

    <a-text value="Reproductor 3D" position="-1.55 2.45 -4.78" width="6" color="#ffffff"></a-text>

    <a-entity id="play-control" class="interactable" music-control="action: play"
      geometry="primitive: sphere; radius: 0.55" material="color: #2ec27e; emissive: #0d5c39; emissiveIntensity: 0.35"
      position="-2.25 1.1 -4.2">
      <a-text value="Play" align="center" color="#ffffff" position="0 1.05 0" width="4"></a-text>
    </a-entity>

    <a-entity id="pause-control" class="interactable" music-control="action: pause"
      geometry="primitive: box; height: 0.9; width: 0.9; depth: 0.9"
      material="color: #f6d32d; emissive: #786400; emissiveIntensity: 0.35" position="-0.7 1.1 -4.2">
      <a-text value="Pause" align="center" color="#ffffff" position="0 1.05 0" width="4"></a-text>
    </a-entity>

    <a-entity id="prev-control" class="interactable" music-control="action: prev"
      geometry="primitive: cone; radiusBottom: 0.55; radiusTop: 0.08; height: 1.1"
      material="color: #4cc9f0; emissive: #0a5064; emissiveIntensity: 0.35" rotation="0 0 90" position="0.95 1.1 -4.2">
    </a-entity>

    <a-text value="Prev" align="center" color="#ffffff" position="0.95 2.15 -4.2" width="4"></a-text>

    <a-entity id="next-control" class="interactable" music-control="action: next"
      geometry="primitive: cone; radiusBottom: 0.55; radiusTop: 0.08; height: 1.1"
      material="color: #ef476f; emissive: #6f1730; emissiveIntensity: 0.35" rotation="0 0 -90" position="2.5 1.1 -4.2">
    </a-entity>

    <a-text value="Next" align="center" color="#ffffff" position="2.5 2.15 -4.2" width="4"></a-text>

    <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 9000; easing: linear">
      <a-box position="4 1.1 -6" depth="0.75" height="0.75" width="0.75" color="#8ecae6"></a-box>
      <a-octahedron position="0 2.9 -7" radius="0.7" color="#fb8500"></a-octahedron>
    </a-entity>

    <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 7000; easing: linear">
      <a-sphere position="3.2 2.8 -7.2" radius="0.22" color="#ff6b6b"></a-sphere>
      <a-sphere position="-3.5 2.4 -6.8" radius="0.18" color="#ffd166"></a-sphere>
      <a-sphere position="4.4 1.9 -8.2" radius="0.2" color="#06d6a0"></a-sphere>
      <a-sphere position="-4.3 1.7 -7.6" radius="0.16" color="#118ab2"></a-sphere>
    </a-entity>

    <a-entity animation="property: rotation; to: 0 -360 0; loop: true; dur: 10000; easing: linear">
      <a-sphere position="2.2 3.5 -8.8" radius="0.24" color="#ef476f"></a-sphere>
      <a-sphere position="-2.6 3.2 -8.4" radius="0.21" color="#8338ec"></a-sphere>
      <a-sphere position="5 2.6 -9.1" radius="0.17" color="#3a86ff"></a-sphere>
      <a-sphere position="-5.1 2.2 -9.4" radius="0.19" color="#ff006e"></a-sphere>
    </a-entity>

    <a-entity animation="property: rotation; to: 360 0 0; loop: true; dur: 8500; easing: linear">
      <a-sphere position="1.2 4.1 -7.5" radius="0.15" color="#80ed99"></a-sphere>
      <a-sphere position="-1.4 4.4 -7.8" radius="0.19" color="#f4a261"></a-sphere>
      <a-sphere position="3.8 3.9 -8.6" radius="0.14" color="#9b5de5"></a-sphere>
      <a-sphere position="-3.7 4 -8.5" radius="0.2" color="#00bbf9"></a-sphere>
    </a-entity>

    <a-entity animation="property: rotation; to: 0 360 360; loop: true; dur: 12000; easing: linear">
      <a-sphere position="5.5 3.4 -10.2" radius="0.23" color="#e63946"></a-sphere>
      <a-sphere position="-5.4 3.6 -10" radius="0.18" color="#a8dadc"></a-sphere>
      <a-sphere position="0.4 4.8 -9.6" radius="0.16" color="#ffbe0b"></a-sphere>
      <a-sphere position="-0.8 5 -9.8" radius="0.2" color="#52b788"></a-sphere>
      <a-sphere position="2.8 4.6 -10.4" radius="0.15" color="#ff99c8"></a-sphere>
      <a-sphere position="-2.9 4.5 -10.3" radius="0.17" color="#90e0ef"></a-sphere>
    </a-entity>

    <a-light type="ambient" color="#c7ddff" intensity="0.65"></a-light>
    <a-light type="point" color="#ffffff" intensity="1.15" position="0 4 -3"></a-light>
  </a-scene>

  <script>
    const playlist = [
      "Canciones/[Baumkuchen End Credits] 雨良 Amala ｜ Cover Español by LordM ft @LaLuki @ItsMilaSolis.mp3",
      "Canciones/Conjeturas - 4x3 (Vídeo Oficial).mp3",
      "Canciones/Cray Dalton - No nací para el amor ｜ NNPEA.mp3"
    ];

    const audioPlayer = document.getElementById("audio-player");
    const songTitle = document.getElementById("song-title");
    const statusText = document.getElementById("status-text");
    let currentIndex = 0;
    let interactionUnlocked = false;

    function getSongName(path) {
      const fileName = path.split("/").pop() || path;
      return fileName.replace(/\.mp3$/i, "");
    }

    function updateHud(message) {
      songTitle.textContent = `Canción actual: ${getSongName(playlist[currentIndex])}`;
      statusText.textContent = message;
    }

    function loadTrack(index, autoPlay = false) {
      currentIndex = (index + playlist.length) % playlist.length;
      audioPlayer.src = encodeURI(playlist[currentIndex]);
      audioPlayer.load();
      updateHud(autoPlay ? "Preparando reproducción..." : "Canción lista para reproducirse.");

      if (autoPlay) {
        playCurrentTrack();
      }
    }

    async function playCurrentTrack() {
      try {
        await audioPlayer.play();
        interactionUnlocked = true;
        updateHud("Reproduciendo.");
      } catch (error) {
        updateHud("El navegador requiere un clic para habilitar el audio.");
        console.warn("No se pudo reproducir el audio todavía:", error);
      }
    }

    function pauseCurrentTrack() {
      audioPlayer.pause();
      updateHud("Pausado.");
    }

    function nextTrack() {
      loadTrack(currentIndex + 1, interactionUnlocked || !audioPlayer.paused);
    }

    function previousTrack() {
      loadTrack(currentIndex - 1, interactionUnlocked || !audioPlayer.paused);
    }

    audioPlayer.addEventListener("ended", () => {
      nextTrack();
    });

    audioPlayer.addEventListener("loadeddata", () => {
      if (!audioPlayer.paused) {
        updateHud("Reproduciendo.");
      }
    });

    AFRAME.registerComponent("music-control", {
      schema: {
        action: { type: "string" }
      },

      init: function () {
        const el = this.el;
        const baseScale = { ...el.object3D.scale };
        const originalColor = el.getAttribute("material").color;

        const highlight = () => {
          el.setAttribute("scale", "1.1 1.1 1.1");
          el.setAttribute("material", "emissiveIntensity", 0.7);
          updateHud("Mantén la mirada 1 segundo para activar este control.");
        };

        const reset = () => {
          el.object3D.scale.copy(baseScale);
          el.setAttribute("material", "color", originalColor);
          el.setAttribute("material", "emissiveIntensity", 0.35);
        };

        const runAction = () => {
          interactionUnlocked = true;

          switch (this.data.action) {
            case "play":
              playCurrentTrack();
              break;
            case "pause":
              pauseCurrentTrack();
              break;
            case "next":
              nextTrack();
              break;
            case "prev":
              previousTrack();
              break;
            default:
              break;
          }
        };

        el.addEventListener("fusing", () => {
          updateHud("Activando control...");
        });
        el.addEventListener("mouseenter", highlight);
        el.addEventListener("mouseleave", reset);
        el.addEventListener("click", runAction);
      }
    });

    loadTrack(0, false);
  </script>
</body>

</html>
